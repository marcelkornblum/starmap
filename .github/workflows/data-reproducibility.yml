name: Data Pipeline Reproducibility

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Verify Data Pipeline Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache source catalogues
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/hygdata_v3.csv
          key: ${{ runner.os }}-source-catalogues-${{ hashFiles('scripts/sources.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-source-catalogues-
      - name: Fetch source catalogues and build data artefacts (pass 1)
        run: npm run data:pipeline
      - name: Verify data budgets
        run: npm run audit:budgets
      - name: Snapshot pass 1 manifest
        run: cp public/data/manifest.json /tmp/starmap-manifest-pass1.json
      - name: Rebuild data artefacts (pass 2)
        run: npm run data:build
      - name: Verify deterministic manifest across rebuilds
        run: diff -u /tmp/starmap-manifest-pass1.json public/data/manifest.json
