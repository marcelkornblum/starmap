name: Data Pipeline Reproducibility

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_RELEASE_TAG: data-sources-v1
  RAW_CATALOGUES_SHA256: fc57abc8fae6819e23324e409d6d9bd668213b2920de5715c515bddbca5ab8f5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Verify Data Pipeline Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache source catalogues
        id: raw-cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/hygdata_v3.csv
          key: ${{ runner.os }}-raw-catalogues-${{ env.DATA_RELEASE_TAG }}-${{ env.RAW_CATALOGUES_SHA256 }}
      - name: Download and verify pinned source catalogues
        if: steps.raw-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/starmap-raw
          gh release download "$DATA_RELEASE_TAG" --pattern "raw-catalogues.tar.gz" --dir /tmp/starmap-raw
          echo "${RAW_CATALOGUES_SHA256}  /tmp/starmap-raw/raw-catalogues.tar.gz" | sha256sum -c -
          tar -xzf /tmp/starmap-raw/raw-catalogues.tar.gz
          rm -rf /tmp/starmap-raw
      - name: Build data artefacts (pass 1)
        run: npm run data:build
      - name: Verify data budgets
        run: npm run audit:budgets
      - name: Snapshot pass 1 manifest
        run: cp public/data/manifest.json /tmp/starmap-manifest-pass1.json
      - name: Rebuild data artefacts (pass 2)
        run: npm run data:build
      - name: Verify deterministic manifest across rebuilds
        run: diff -u /tmp/starmap-manifest-pass1.json public/data/manifest.json
