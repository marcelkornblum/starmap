name: Data Pipeline Reproducibility

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Verify Data Pipeline Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch source catalogues and build data artefacts
        run: npm run data:pipeline
      - name: Verify committed public/data artefacts match reproducible build
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            echo "public/data drifted from reproducible build:"
            git status --short public/data
            git diff --stat public/data
            exit 1
          fi
