name: Release Catalogue Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach stars.json.gz assets to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-catalogue:
    name: Build and Upload Stars Catalogue Asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "RELEASE_TAG is empty" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache source catalogues
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/hygdata_v3.csv
          key: ${{ runner.os }}-source-catalogues-${{ hashFiles('scripts/sources.config.ts') }}
      - name: Build data pipeline with stars.json output
        env:
          WRITE_STARS_JSON: '1'
        run: npm run data:pipeline
      - name: Compress stars.json and compute SHA-256 checksum
        run: |
          gzip -9 -c data/stars.json > /tmp/stars.json.gz
          cd /tmp
          sha256sum stars.json.gz > stars.json.gz.sha256
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" --clobber -- /tmp/stars.json.gz /tmp/stars.json.gz.sha256
